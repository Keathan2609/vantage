# OWASP ZAP baseline configuration.
#
# Format: <rule id>\t<IGNORE|INFO|WARN|FAIL>\t<optional comment>
#
# Every IGNORE below is a triaged finding with the reason it is accepted and
# what would change that. A blanket ignore, or a report with unexplained
# warnings in it, means the next person cannot tell a real finding from noise.
#
# Scope reminder: this configuration is used only against 127.0.0.1 --
# the control plane on :8080 and the terminal on :3001. No third-party host is
# ever a target.
#
# Last reviewed against a live scan (2026-09-08, after the reconciliation and
# operations work, so the /operations route is included in the terminal crawl):
#
#   control plane  http://localhost:8080   0 FAIL  0 WARN  69 PASS   4 URLs
#   terminal       production build :3001  0 FAIL  1 WARN  68 PASS  17 URLs
#
# The single WARN is rule 10055 below, which is deliberately set to WARN.
#
# Only four URLs are reachable on the control plane because almost every route
# requires a session, and a passive baseline does not authenticate. That is a
# real limit of this scan, not a clean bill of health for the API surface: the
# authorisation behaviour is covered by the Playwright and smoke suites
# instead.
#
# SCAN THE PRODUCTION BUILD, not `next dev`. A development server legitimately
# adds four more warnings that say nothing about the deployed application:
#
#   CSP: script-src unsafe-eval [10055] x9   hot reloading needs eval; the
#                                            production CSP omits it, which
#                                            `curl -D -` on the built server
#                                            confirms
#   Suspicious Comments [10027] x31          development bundles are not
#                                            minified
#   Dangerous JS Functions [10110] x2        the HMR client
#   Timestamp Disclosure [10096] x1          a development build identifier
#
# Serve the real thing instead. `output: "standalone"` means `next start` is
# unsupported, so:
#
#   npm run build
#   cp -r .next/static .next/standalone/.next/static
#   PORT=3002 node .next/standalone/server.js

# --- Accepted: intentional -----------------------------------------------

# Non-Storable Content.
#
# Deliberate. Every API response carries
# `Cache-Control: no-store, no-cache, must-revalidate, private`, because a
# financial response must never sit in an intermediary cache or a browser's
# disk cache on a shared machine. ZAP reports the ABSENCE of caching as a
# finding; here it is the requirement.
#
# What would change this: nothing. Caching account data would be the defect.
10049	IGNORE	Cache-Control: no-store is required on financial responses

# Modern Web Application.
#
# Informational. ZAP is noting that the terminal is a single-page application
# and that its own spider therefore sees fewer links than a crawler would.
# It is not a vulnerability.
10109	IGNORE	Informational: the terminal is a client-rendered application

# --- Accepted with a known limitation ------------------------------------

# CSP: script-src unsafe-inline.
#
# A fair finding, and NOT dismissed: `'unsafe-inline'` gives away most of what
# a CSP is for.
#
# A nonce-based policy was implemented and reverted, because Next 16's
# Turbopack build emits its bootstrap and chunk <script src> tags without the
# nonce. Under `script-src 'nonce-…' 'strict-dynamic'` the browser blocked
# every chunk and the terminal rendered nothing -- all thirty end-to-end tests
# failed. Adding 'unsafe-inline' alongside a nonce does not help: a browser
# that honours the nonce ignores 'unsafe-inline' by specification.
#
# Shipping a terminal that does not load, in exchange for closing a scanner
# warning, would be the wrong trade.
#
# The exposure is bounded, not absent:
#   * the session cookie is HttpOnly, so an injected script cannot exfiltrate
#     a session
#   * `connect-src` permits exactly one API origin, so it cannot post data
#     anywhere else
#   * no third-party script, font, style or frame is loaded at all
#
# What would resolve it: Next propagating the nonce to Turbopack-emitted
# script tags. See the note in apps/web/middleware.ts for the exact change to
# make when that lands.
10055	WARN	Accepted: framework bootstrap requires unsafe-inline; see middleware.ts

# --- Anything else is a finding to fix -----------------------------------
#
# Rules not listed here keep their default level. A new WARN in a report is a
# thing to triage, not a thing to add to this file without reading it.
