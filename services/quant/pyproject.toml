[project]
name = "vantage-quant"
version = "0.1.0"
description = "Vantage research plane: indicators, strategies, backtesting and machine learning"
# 3.12 is the floor, not a preference: numpy 2.x ships type stubs that use
# `type` statements, which only parse under 3.12, so anything older cannot be
# type-checked against them.
requires-python = ">=3.12"

# Dependencies are deliberately few. Every one of these is load-bearing:
# FastAPI and uvicorn serve the API, pydantic validates every request at the
# boundary, numpy and pandas do the numerics, and scikit-learn provides the
# baseline models. Nothing is here for appearances.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.112,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pandas-stubs>=2.2,<3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vantage_quant*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Assertions are used in tests and in internal invariant checks where a
    # violation is a programming error rather than bad input.
    "B011",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
